spring.application.name=demoAmazonq

# Server Configuration
#server.port=8081

# Stripe Configuration (Use environment variables in production)
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_your_key_here}
stripe.success.url=${STRIPE_SUCCESS_URL:http://localhost:8080/success.html}
stripe.cancel.url=${STRIPE_CANCEL_URL:http://localhost:8080/cancel.html}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_your_secret_here}

# Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Flyway - disable for H2 in dev
spring.flyway.enabled=false

# Email Configuration (Use environment variables in production)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging Configuration
logging.level.com.example.demo=INFO
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
